<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Riedel classics – Betriebshandbuch</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f5f5f5;color:#222;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;font-size:14px}
/* TOP BAR */
#bar{background:#1a1a1a;padding:0 16px;height:54px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100;border-bottom:3px solid #c0392b}
#logo{display:flex;flex-direction:column;flex:1}
#logo span:first-child{color:#fff;font-size:15px;font-weight:900;letter-spacing:1px}
#logo span:last-child{color:#c0392b;font-size:9px;letter-spacing:3px;text-transform:uppercase}
.tb{background:none;border:1px solid #555;color:#ccc;padding:6px 12px;font-size:11px;text-transform:uppercase;cursor:pointer;letter-spacing:1px;border-radius:3px}
.tb.r{background:#c0392b;border-color:#c0392b;color:#fff;font-weight:600}
/* BODY: sidebar left, content right using inline-block */
#wrap{display:block;width:100%}
#nav{display:inline-block;vertical-align:top;width:190px;background:#2c2c2c;min-height:calc(100vh - 54px)}
#main{display:inline-block;vertical-align:top;width:calc(100% - 194px);padding:20px;background:#f5f5f5;min-height:calc(100vh - 54px)}
/* NAV */
.ng{padding:12px 0 4px}
.ngl{font-size:9px;color:#888;letter-spacing:2px;text-transform:uppercase;padding:0 14px 5px;display:block}
.nb{display:block;width:100%;background:none;border:none;border-left:3px solid transparent;padding:10px 14px;text-align:left;color:#aaa;font-size:13px;cursor:pointer;-webkit-tap-highlight-color:rgba(192,57,43,.3)}
.nb.on{color:#fff;border-left-color:#c0392b;background:rgba(192,57,43,.15)}
.nb:active{background:rgba(255,255,255,.05)}
/* CONTENT */
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-bottom:12px;border-bottom:2px solid #e0e0e0;gap:10px;flex-wrap:wrap}
.pt{font-size:20px;font-weight:900;color:#1a1a1a;letter-spacing:1px}
.abtn{background:#c0392b;border:none;color:#fff;padding:8px 16px;font-size:12px;font-weight:600;cursor:pointer;border-radius:3px;letter-spacing:1px}
/* CARDS */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:#fff;border:1px solid #e0e0e0;border-radius:6px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.chd{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:9px;gap:6px}
.ct{font-size:13px;font-weight:700;color:#1a1a1a;word-break:break-word}
.ca{display:flex;align-items:center;gap:2px;flex-shrink:0}
.ib{background:none;border:none;color:#aaa;font-size:14px;padding:3px 6px;cursor:pointer;border-radius:3px}
.ib:active{background:#f0f0f0}
.cf{display:flex;gap:8px;margin-bottom:3px;font-size:12px;line-height:1.4}
.cl{color:#999;min-width:80px;flex-shrink:0}
.cv{color:#333;word-break:break-word}
.bdg{display:inline-block;font-size:10px;padding:2px 7px;border-radius:10px;font-weight:600;margin-left:4px}
.bg{background:#e8f5e9;color:#2e7d32}.bo{background:#fff3e0;color:#e65100}.br{background:#fdecea;color:#c62828}.bx{background:#f5f5f5;color:#666}
/* STATS */
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-bottom:20px}
.sc{background:#fff;border:1px solid #e0e0e0;border-radius:6px;padding:14px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.sn{font-size:32px;font-weight:900;color:#c0392b}
.sl{font-size:9px;color:#999;margin-top:2px;text-transform:uppercase;letter-spacing:1px}
.ntc{background:#fff3cd;border-left:3px solid #e65100;padding:10px 14px;font-size:12px;color:#7a4100;margin-bottom:14px;border-radius:0 4px 4px 0}
.ntcr{background:#fdecea;border-left:3px solid #c0392b;padding:10px 14px;font-size:12px;color:#7a1a1a;margin-bottom:14px;border-radius:0 4px 4px 0}
.sbar{position:relative;margin-bottom:12px}
.sbar input{width:100%;background:#fff;border:1px solid #ddd;color:#222;padding:9px 12px 9px 32px;font-size:13px;outline:none;border-radius:4px}
.sbar input:focus{border-color:#c0392b;box-shadow:0 0 0 2px rgba(192,57,43,.1)}
.sico{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#aaa;pointer-events:none}
.empty{text-align:center;padding:32px;color:#bbb;border:2px dashed #e0e0e0;border-radius:6px;font-size:13px;background:#fff}
/* MODAL */
#ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:999;align-items:center;justify-content:center;padding:16px}
#ov.show{display:flex}
#mod{background:#fff;border-radius:8px;width:100%;max-width:520px;max-height:88vh;overflow-y:auto;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.mt{font-size:17px;font-weight:900;color:#1a1a1a;margin-bottom:16px}
.fr{margin-bottom:11px}
.fl{display:block;font-size:10px;color:#999;letter-spacing:1px;text-transform:uppercase;margin-bottom:4px;font-weight:600}
input[type=text],input[type=date],textarea,select{width:100%;background:#f8f8f8;border:1px solid #ddd;color:#222;font-size:13px;padding:9px 11px;outline:none;border-radius:4px;font-family:inherit;-webkit-appearance:none}
input:focus,textarea:focus,select:focus{border-color:#c0392b;background:#fff;box-shadow:0 0 0 2px rgba(192,57,43,.1)}
textarea{resize:vertical;min-height:65px}
select option{background:#fff}
.ma{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;padding-top:14px;border-top:1px solid #eee}
/* SETTINGS */
.sf{background:#fff;border:1px solid #e0e0e0;border-radius:6px;padding:18px;max-width:460px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.dz{border:2px solid #fdecea;border-radius:6px;padding:14px;max-width:460px;background:#fffbfb}
.dzt{font-size:10px;color:#c0392b;letter-spacing:2px;text-transform:uppercase;margin-bottom:7px;font-weight:700}
.sec-lbl{font-size:10px;color:#999;letter-spacing:2px;text-transform:uppercase;margin-bottom:10px;margin-top:16px;font-weight:600}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:#ddd;border-radius:2px}
</style>
</head>
<body>
<div id="bar">
  <div id="logo"><span>Riedel classics</span><span>Betriebshandbuch</span></div>
  <button class="tb" id="bExp">&#128190; Export</button>
  <label class="tb" style="cursor:pointer">&#128194; Import<input type="file" id="bFile" accept=".json" style="display:none"></label>
  <button class="tb r" id="bNew">+ Neu</button>
</div>
<div id="wrap">
<div id="nav">
  <div class="ng"><span class="ngl">&#220;bersicht</span>
    <button class="nb on" data-p="dashboard">&#128202; Dashboard</button>
  </div>
  <div class="ng"><span class="ngl">Betrieb</span>
    <button class="nb" data-p="fahrzeuge">&#128663; Fahrzeuge</button>
    <button class="nb" data-p="auftraege">&#128295; Auftr&#228;ge</button>
    <button class="nb" data-p="inventar">&#128447; Inventar</button>
    <button class="nb" data-p="kunden">&#128101; Kunden</button>
    <button class="nb" data-p="lieferanten">&#128230; Lieferanten</button>
  </div>
  <div class="ng"><span class="ngl">Finanzen</span>
    <button class="nb" data-p="finanzen">&#128182; Konten</button>
    <button class="nb" data-p="vertraege">&#128203; Vertr&#228;ge</button>
    <button class="nb" data-p="versicherungen">&#128737; Versicherungen</button>
  </div>
  <div class="ng"><span class="ngl">Wichtig</span>
    <button class="nb" data-p="zugaenge">&#128273; Zug&#228;nge</button>
    <button class="nb" data-p="kontakte">&#128222; Notfallkontakte</button>
    <button class="nb" data-p="rechtliches">&#9878; Rechtliches</button>
    <button class="nb" data-p="notizen">&#128221; Notizen</button>
  </div>
  <div class="ng"><span class="ngl">System</span>
    <button class="nb" data-p="einstellungen">&#9881; Einstellungen</button>
  </div>
</div>
<div id="main">Wird geladen...</div>
</div>
<div id="ov">
  <div id="mod">
    <div class="mt" id="mtitle"></div>
    <div id="mbody"></div>
    <div class="ma">
      <button class="tb" id="bCan" style="color:#666;border-color:#ddd">Abbrechen</button>
      <button class="tb r" id="bSav">Speichern</button>
    </div>
  </div>
</div>
<script>
var db={settings:{firma:'',inhaber:'',adresse:'',telefon:'',email:'',anweisung:''},fahrzeuge:[],auftraege:[],inventar:[],kunden:[],lieferanten:[],finanzen:[],vertraege:[],versicherungen:[],zugaenge:[],kontakte:[],rechtliches:[],notizen:[]};
var cSec=null,eId=null,cPage='dashboard';
function lsLoad(){try{var s=localStorage.getItem('rc_bh');if(s){var p=JSON.parse(s);for(var k in p)if(Object.prototype.hasOwnProperty.call(p,k))db[k]=p[k];if(!db.inventar)db.inventar=[]}}catch(e){}}
function lsSave(){try{localStorage.setItem('rc_bh',JSON.stringify(db))}catch(e){}}
function h(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
var F={
  fahrzeuge:{t:'Fahrzeug',f:[{k:'bezeichnung',l:'Bezeichnung / Modell',r:1},{k:'marke',l:'Marke'},{k:'baujahr',l:'Baujahr'},{k:'kennzeichen',l:'Kennzeichen'},{k:'vin',l:'Fahrgestellnummer (VIN)'},{k:'eigentuemer',l:'Eigentümer',tp:'sel',o:['Eigenes Fahrzeug','Kundenfahrzeug']},{k:'kunde',l:'Kunde'},{k:'standort',l:'Standort Werkstatt'},{k:'zustand',l:'Restaurationsstand',tp:'ta'},{k:'schaetzwert',l:'Schätzwert (€)'},{k:'besonderheiten',l:'Besonderheiten',tp:'ta'}]},
  auftraege:{t:'Auftrag',f:[{k:'titel',l:'Auftragsbezeichnung',r:1},{k:'fahrzeug',l:'Fahrzeug'},{k:'kunde',l:'Kunde'},{k:'status',l:'Status',tp:'sel',o:['Offen','In Arbeit','Pausiert','Abgeschlossen','Storniert']},{k:'beginn',l:'Beginn',tp:'date'},{k:'abgabedatum',l:'Geplante Abgabe',tp:'date'},{k:'vereinbarterPreis',l:'Vereinbarter Preis (€)'},{k:'bereitsGezahlt',l:'Bereits gezahlt (€)'},{k:'beschreibung',l:'Was wurde vereinbart',tp:'ta'},{k:'standArbeit',l:'Aktueller Stand',tp:'ta'},{k:'naechsteSchritte',l:'Nächste Schritte',tp:'ta'},{k:'materialien',l:'Materialien / Teile',tp:'ta'}]},
  inventar:{t:'Inventarartikel',f:[{k:'bezeichnung',l:'Bezeichnung',r:1},{k:'kategorie',l:'Kategorie',tp:'sel',o:['Maschine / Gerät','Handwerkzeug','Elektrowerkzeug','Hebähne / Lift','Messgerät','Schweißtechnik','Lackiertechnik','Ersatzteil / Lager','Verbrauchsmaterial','Fahrzeugzubehör','Büro / EDV','Sonstiges']},{k:'hersteller',l:'Hersteller / Marke'},{k:'modell',l:'Modell / Typ'},{k:'seriennummer',l:'Seriennummer / ID'},{k:'standort',l:'Standort / Lagerplatz'},{k:'zustand',l:'Zustand',tp:'sel',o:['Neuwertig','Gut','In Ordnung','Wartungsbedarf','Defekt']},{k:'kaufdatum',l:'Kaufdatum',tp:'date'},{k:'kaufpreis',l:'Kaufpreis (€)'},{k:'aktuellerwert',l:'Schätzwert (€)'},{k:'menge',l:'Menge / Anzahl'},{k:'lieferant',l:'Lieferant'},{k:'garantieBis',l:'Garantie bis',tp:'date'},{k:'wartungsintervall',l:'Wartungsintervall'},{k:'letzteWartung',l:'Letzte Wartung',tp:'date'},{k:'dokumente',l:'Wo liegen Unterlagen?'},{k:'hinweise',l:'Hinweise',tp:'ta'}]},
  kunden:{t:'Kunde',f:[{k:'name',l:'Name / Firma',r:1},{k:'ansprechpartner',l:'Ansprechpartner'},{k:'telefon',l:'Telefon'},{k:'email',l:'E-Mail'},{k:'adresse',l:'Adresse',tp:'ta'},{k:'kundenNummer',l:'Kundennummer'},{k:'beziehung',l:'Beziehung / Hinweise',tp:'ta'},{k:'offeneForderungen',l:'Offene Forderungen (€)'}]},
  lieferanten:{t:'Lieferant',f:[{k:'name',l:'Firma / Name',r:1},{k:'kontakt',l:'Ansprechpartner'},{k:'telefon',l:'Telefon'},{k:'email',l:'E-Mail'},{k:'website',l:'Website'},{k:'adresse',l:'Adresse',tp:'ta'},{k:'sortiment',l:'Was wird geliefert'},{k:'kundennummer',l:'Kundennummer bei Lieferant'},{k:'konditionen',l:'Konditionen / Rabatte',tp:'ta'},{k:'bewertung',l:'Bewertung',tp:'sel',o:['Sehr gut','Gut','Ok','Problematisch']}]},
  finanzen:{t:'Konto',f:[{k:'bezeichnung',l:'Bezeichnung',r:1},{k:'typ',l:'Typ',tp:'sel',o:['Girokonto','Sparkonto','Kreditkarte','Barkasse','Offene Forderung','Verbindlichkeit','Sonstiges']},{k:'bank',l:'Bank'},{k:'iban',l:'IBAN'},{k:'betrag',l:'Betrag / Kontostand (€)'},{k:'bevollmaechtigte',l:'Bevollmächtigte Personen'},{k:'zugang',l:'Wie kommt man ran?',tp:'ta'},{k:'hinweis',l:'Hinweise',tp:'ta'}]},
  vertraege:{t:'Vertrag',f:[{k:'bezeichnung',l:'Bezeichnung',r:1},{k:'vertragspartner',l:'Vertragspartner'},{k:'typ',l:'Typ',tp:'sel',o:['Mietvertrag','Leasingvertrag','Wartungsvertrag','Abonnement','Liefervertrag','Arbeitsvertrag','Sonstiges']},{k:'kosten',l:'Kosten (€)'},{k:'kuendigungsfrist',l:'Kündigungsfrist'},{k:'naechsteKuendigung',l:'Nächster Kündigungstermin',tp:'date'},{k:'vertragsort',l:'Wo liegt der Vertrag?'},{k:'wichtig',l:'Wichtige Klauseln',tp:'ta'}]},
  versicherungen:{t:'Versicherung',f:[{k:'bezeichnung',l:'Versicherungsart',r:1},{k:'gesellschaft',l:'Versicherungsgesellschaft'},{k:'polizzenNummer',l:'Polizzennummer'},{k:'telefon',l:'Telefon Versicherung'},{k:'deckung',l:'Was ist gedeckt?',tp:'ta'},{k:'praemie',l:'Prämie (€)'},{k:'faelligkeit',l:'Fälligkeit'},{k:'dokumente',l:'Wo liegen Dokumente?'},{k:'schadenfall',l:'Was tun im Schadensfall?',tp:'ta'}]},
  zugaenge:{t:'Zugang / Passwort',f:[{k:'bezeichnung',l:'Dienst / System',r:1},{k:'typ',l:'Typ',tp:'sel',o:['E-Mail','Banking','Behördenportal','Software','Website','Gerät / PIN','Safe / Schloss','Sonstiges']},{k:'url',l:'URL / Adresse'},{k:'benutzername',l:'Benutzername / E-Mail'},{k:'passwort',l:'Passwort / PIN / Code'},{k:'zweck',l:'Wofür wird das gebraucht?'},{k:'hinweis',l:'Hinweise (2FA, etc.)',tp:'ta'}]},
  kontakte:{t:'Notfallkontakt',f:[{k:'name',l:'Name',r:1},{k:'rolle',l:'Rolle',tp:'sel',o:['Steuerberater','Anwalt','Notar','Familienmänglied','Geschäftspartner','Mitarbeiter','Behörde','Sonstiges']},{k:'telefon',l:'Telefon (mobil)'},{k:'telefon2',l:'Telefon (geschäftlich)'},{k:'email',l:'E-Mail'},{k:'adresse',l:'Adresse / Kanzlei',tp:'ta'},{k:'prioritaet',l:'Priorität',tp:'sel',o:['Zuerst kontaktieren','Wichtig','Normal']},{k:'zustaendig',l:'Zuständig für',tp:'ta'},{k:'unterlagen',l:'Benötigte Unterlagen',tp:'ta'}]},
  rechtliches:{t:'Rechtliches',f:[{k:'bezeichnung',l:'Bezeichnung',r:1},{k:'typ',l:'Typ',tp:'sel',o:['Gewerbeschein','Steuernummer','Umsatzsteuer-ID','Handelsregistereintrag','Berufserlaubnis','Sonstiges']},{k:'nummer',l:'Nummer / ID'},{k:'behoerde',l:'Ausstellende Behörde'},{k:'ausstelldatum',l:'Ausstelldatum',tp:'date'},{k:'gueltigBis',l:'Gültig bis',tp:'date'},{k:'dokumentOrt',l:'Wo liegt das Dokument?'},{k:'hinweis',l:'Hinweise',tp:'ta'}]},
  notizen:{t:'Notiz',f:[{k:'titel',l:'Titel',r:1},{k:'kategorie',l:'Kategorie',tp:'sel',o:['Wichtiger Hinweis','Technisches Wissen','Ablauf / Prozess','Standorte','Kombinationen / Codes','Anweisung an Hinterbliebene','Sonstiges']},{k:'prioritaet',l:'Priorität',tp:'sel',o:['Kritisch','Wichtig','Normal']},{k:'inhalt',l:'Inhalt',tp:'ta',r:1}]}
};
var PT={dashboard:'Dashboard',fahrzeuge:'Fahrzeuge',auftraege:'Aufträge',inventar:'Inventar',kunden:'Kunden',lieferanten:'Lieferanten',finanzen:'Konten & Finanzen',vertraege:'Verträge',versicherungen:'Versicherungen',zugaenge:'Zugänge & Passwörter',kontakte:'Notfallkontakte',rechtliches:'Rechtliches',notizen:'Notizen',einstellungen:'Einstellungen'};
function ct(s,x){var m={fahrzeuge:x.bezeichnung||x.marke,auftraege:x.titel,inventar:x.bezeichnung,kunden:x.name,lieferanten:x.name,finanzen:x.bezeichnung,vertraege:x.bezeichnung,versicherungen:x.bezeichnung,zugaenge:x.bezeichnung,kontakte:x.name,rechtliches:x.bezeichnung,notizen:x.titel};return m[s]||'?'}
function mkB(s,x){var c,t;if(s==='auftraege'&&x.status){var m={Offen:'bx','In Arbeit':'bo',Abgeschlossen:'bg',Pausiert:'br',Storniert:'br'};c=m[x.status]||'bx';t=x.status}else if(s==='inventar'&&x.zustand){var m={Neuwertig:'bg',Gut:'bg','In Ordnung':'bx',Wartungsbedarf:'bo',Defekt:'br'};c=m[x.zustand]||'bx';t=x.zustand}else if(s==='kontakte'&&x.prioritaet){var m={'Zuerst kontaktieren':'br',Wichtig:'bo',Normal:'bx'};c=m[x.prioritaet]||'bx';t=x.prioritaet}else if(s==='notizen'&&x.prioritaet){var m={Kritisch:'br',Wichtig:'bo',Normal:'bx'};c=m[x.prioritaet]||'bx';t=x.prioritaet}if(!t)return '';return '<span class="bdg '+c+'">'+h(t)+'</span>'}
function cfl(s,x){var m={fahrzeuge:[['Eigentümer',x.eigentuemer],['Kennzeichen',x.kennzeichen],['Baujahr',x.baujahr],['Standort',x.standort],['Zustand',x.zustand]],auftraege:[['Fahrzeug',x.fahrzeug],['Kunde',x.kunde],['Preis',x.vereinbarterPreis],['Stand',x.standArbeit]],inventar:[['Kategorie',x.kategorie],['Hersteller',x.hersteller],['Seriennr.',x.seriennummer],['Standort',x.standort],['Menge',x.menge],['Kaufpreis',x.kaufpreis],['Garantie bis',x.garantieBis]],kunden:[['Telefon',x.telefon],['E-Mail',x.email],['Adresse',x.adresse],['Forderungen',x.offeneForderungen]],lieferanten:[['Telefon',x.telefon],['E-Mail',x.email],['Sortiment',x.sortiment]],finanzen:[['Typ',x.typ],['Bank',x.bank],['IBAN',x.iban],['Betrag',x.betrag]],vertraege:[['Partner',x.vertragspartner],['Typ',x.typ],['Kosten',x.kosten],['Kündigung',x.naechsteKuendigung]],versicherungen:[['Gesellschaft',x.gesellschaft],['Polizze',x.polizzenNummer],['Prämie',x.praemie]],zugaenge:[['Typ',x.typ],['Benutzer',x.benutzername],['Passwort',x.passwort]],kontakte:[['Rolle',x.rolle],['Telefon',x.telefon],['E-Mail',x.email]],rechtliches:[['Typ',x.typ],['Nummer',x.nummer],['Behörde',x.behoerde],['Gültig bis',x.gueltigBis]],notizen:[['Kategorie',x.kategorie],['Inhalt',x.inhalt]]};var r=m[s]||[];var o=[];for(var i=0;i<r.length;i++){if(r[i][1])o.push(r[i])}return o}
function rCards(s,q){var items=db[s]||[];if(q){var ql=q.toLowerCase();var f=[];for(var i=0;i<items.length;i++){if(JSON.stringify(items[i]).toLowerCase().indexOf(ql)>=0)f.push(items[i])}items=f}if(!items.length)return '<div class="empty">Noch keine Einträge vorhanden.<br><small>Klicke auf &ldquo;+ '+h((F[s]||{}).t||'Eintrag')+'&rdquo; um zu beginnen.</small></div>';var o='<div class="grid">';for(var i=0;i<items.length;i++){var x=items[i];var fs=cfl(s,x);var fh='';for(var j=0;j<fs.length;j++)fh+='<div class="cf"><span class="cl">'+h(fs[j][0])+'</span><span class="cv">'+h(fs[j][1])+'</span></div>';o+='<div class="card"><div class="chd"><div class="ct">'+h(ct(s,x))+'</div><div class="ca">'+mkB(s,x)+'<button class="ib" data-a="ed" data-s="'+s+'" data-i="'+x.id+'">&#9998;</button><button class="ib" data-a="dl" data-s="'+s+'" data-i="'+x.id+'">×</button></div></div>'+fh+'</div>'}return o+'</div>'}
function go(name){
  var M=_MAIN||document.getElementById('main');
  if(!M){console.log('main not found');return;}
  M.innerHTML='<p style="color:red;padding:20px;">Schritt 1: go('+name+') gestartet</p>';
  cPage=name;
  try{
    var ns=document.querySelectorAll('.nb');
    for(var i=0;i<ns.length;i++)ns[i].classList.toggle('on',ns[i].getAttribute('data-p')===name);
  }catch(e){M.innerHTML='<p style="color:red;padding:20px;">Fehler nav: '+e.message+'</p>';return;}
  M.innerHTML='<p style="color:red;padding:20px;">Schritt 2: nav OK</p>';
  var cfg=F[name];
  var ab='';
  try{ab=cfg?'<button class="abtn" data-a="add" data-s="'+name+'">+ '+h(cfg.t)+'</button>':'';}catch(e){M.innerHTML='<p style="color:red;padding:20px;">Fehler ab: '+e.message+'</p>';return;}
  var ph='';
  try{ph='<div class="ph"><div class="pt">'+h(PT[name]||name)+'</div>'+ab+'</div>';}catch(e){M.innerHTML='<p style="color:red;padding:20px;">Fehler ph: '+e.message+'</p>';return;}
  M.innerHTML='<p style="color:red;padding:20px;">Schritt 3: ph OK, page='+name+'</p>';
  if(name==='dashboard'){
    var out='';
    out+='<div class="ntc">Vertraulich - nur fuer Hinterbliebene und Bevollmaechtigte. Regelmaessig exportieren!</div>';
    out+='<div class="stats">';
    var ks=['fahrzeuge','auftraege','inventar','kunden','lieferanten','vertraege','versicherungen','zugaenge'];
    var lb=['Fahrzeuge','Auftraege','Inventar','Kunden','Lieferanten','Vertraege','Versicherungen','Zugaenge'];
    for(var qi=0;qi<ks.length;qi++){
      out+='<div class="sc"><div class="sn">'+(db[ks[qi]]||[]).length+'</div><div class="sl">'+lb[qi]+'</div></div>';
    }
    out+='</div>';
    out+='<div class="sec-lbl">Offene Auftraege</div>';
    var au=db.auftraege||[];
    var hasOff=false;
    var offHtml='<div class="grid">';
    for(var qi=0;qi<au.length;qi++){
      if(au[qi].status==='In Arbeit'||au[qi].status==='Offen'){
        hasOff=true;
        offHtml+='<div class="card">';
        offHtml+='<div class="chd"><div class="ct">'+h(au[qi].titel||'')+'</div>'+mkB('auftraege',au[qi])+'</div>';
        if(au[qi].fahrzeug)offHtml+='<div class="cf"><span class="cl">Fahrzeug</span><span class="cv">'+h(au[qi].fahrzeug)+'</span></div>';
        if(au[qi].kunde)offHtml+='<div class="cf"><span class="cl">Kunde</span><span class="cv">'+h(au[qi].kunde)+'</span></div>';
        if(au[qi].standArbeit)offHtml+='<div class="cf"><span class="cl">Stand</span><span class="cv">'+h(au[qi].standArbeit)+'</span></div>';
        offHtml+='</div>';
      }
    }
    offHtml+='</div>';
    if(!hasOff)offHtml='<div class="empty">Keine offenen Auftraege</div>';
    out+=offHtml;
    M.innerHTML=ph+out;
    return;
  }
  if(name==='einstellungen'){
    var s=db.settings||{};
    M.innerHTML=ph+'<div class="sf"><div style="font-size:11px;color:#c0392b;font-weight:700;letter-spacing:1px;margin-bottom:14px;text-transform:uppercase;">Firmendaten</div><div class="fr"><label class="fl">Firmenname</label><input type="text" id="s0" value="'+h(s.firma||'')+'"></div><div class="fr"><label class="fl">Inhaber</label><input type="text" id="s1" value="'+h(s.inhaber||'')+'"></div><div class="fr"><label class="fl">Adresse</label><textarea id="s2" rows="2">'+h(s.adresse||'')+'</textarea></div><div class="fr"><label class="fl">Telefon</label><input type="text" id="s3" value="'+h(s.telefon||'')+'"></div><div class="fr"><label class="fl">E-Mail</label><input type="text" id="s4" value="'+h(s.email||'')+'"></div><div class="fr"><label class="fl">Anweisungen an Hinterbliebene</label><textarea id="s5" rows="4">'+h(s.anweisung||'')+'</textarea></div><button class="abtn" style="margin-top:8px" data-a="svs">Speichern</button></div><div class="dz"><div class="dzt">&#9888; Gefahrenzone</div><p style="color:#999;font-size:12px;margin-bottom:10px;">Diese Aktion kann nicht rükgängig gemacht werden.</p><button class="tb" style="border-color:#c0392b;color:#c0392b" data-a="clr">Alle Daten löschen</button></div>';
    return;
  }
  if(!cfg){M.innerHTML='<p style="color:#999;padding:16px">Nicht gefunden.</p>';return;}
  M.innerHTML=ph+(name==='zugaenge'?'<div class="ntcr">&#128272; Sensible Daten – nur für Bevollmächtigte.</div>':'')+'<div class="sbar"><span class="sico">&#128269;</span><input type="text" id="sb" placeholder="Suchen..."></div><div id="cl">'+rCards(name,'')+'</div>';
}
function oMod(s,id){var cfg=F[s];if(!cfg)return;cSec=s;eId=id||null;var x={};if(id){var a=db[s]||[];for(var i=0;i<a.length;i++){if(a[i].id===id){x=a[i];break}}}document.getElementById('mtitle').textContent=id?cfg.t+' bearbeiten':cfg.t+' erfassen';var o='';for(var i=0;i<cfg.f.length;i++){var f=cfg.f[i];var v=x[f.k]||'';var inp;if(f.tp==='ta')inp='<textarea id="fi'+i+'" rows="3">'+h(v)+'</textarea>';else if(f.tp==='sel'){var opts='<option value="">– wählen –</option>';for(var j=0;j<f.o.length;j++)opts+='<option'+(f.o[j]===v?' selected':'')+'>'+h(f.o[j])+'</option>';inp='<select id="fi'+i+'">'+opts+'</select>'}else if(f.tp==='date')inp='<input type="date" id="fi'+i+'" value="'+h(v)+'">';else inp='<input type="text" id="fi'+i+'" value="'+h(v)+'" placeholder="'+h(f.l)+'">';o+='<div class="fr"><label class="fl">'+h(f.l)+(f.r?' *':'')+'</label>'+inp+'</div>'}document.getElementById('mbody').innerHTML=o;document.getElementById('ov').classList.add('show')}
function cMod(){document.getElementById('ov').classList.remove('show');cSec=null;eId=null}
function sEnt(){if(!cSec)return;var cfg=F[cSec];var data={id:eId||String(Date.now()),_ts:new Date().toISOString()};var ok=true;for(var i=0;i<cfg.f.length;i++){var f=cfg.f[i];var el=document.getElementById('fi'+i);if(el){data[f.k]=el.value.trim();if(f.r&&!data[f.k]){el.style.borderColor='#c0392b';ok=false}else el.style.borderColor=''}}if(!ok)return;if(!db[cSec])db[cSec]=[];if(eId){for(var i=0;i<db[cSec].length;i++){if(db[cSec][i].id===eId){db[cSec][i]=data;break}}}else db[cSec].push(data);lsSave();cMod();go(cSec)}
function dEnt(s,id){if(!confirm('Eintrag löschen?'))return;var a=db[s]||[];var n=[];for(var i=0;i<a.length;i++){if(a[i].id!==id)n.push(a[i])}db[s]=n;lsSave();go(s)}
function svSet(){if(!db.settings)db.settings={};var ks=['firma','inhaber','adresse','telefon','email','anweisung'];for(var i=0;i<ks.length;i++){var el=document.getElementById('s'+i);if(el)db.settings[ks[i]]=el.value}lsSave();alert('Einstellungen gespeichert!')}
function expData(){var json=JSON.stringify(db,null,2);try{var b=new Blob([json],{type:'application/json'});var u=URL.createObjectURL(b);var a=document.createElement('a');a.href=u;a.download='rc_bh_'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(function(){URL.revokeObjectURL(u)},1000)}catch(ex){prompt('JSON (kopieren und als .json speichern):',json)}}
function impData(ev){var f=ev.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(e){try{var imp=JSON.parse(e.target.result);if(confirm('Aktuelle Daten überschreiben?')){for(var k in imp){if(Object.prototype.hasOwnProperty.call(imp,k))db[k]=imp[k]}lsSave();go('dashboard');alert('Import erfolgreich!')}}catch(err){alert('Fehler: '+err.message)}};r.readAsText(f);ev.target.value=''}

document.getElementById('main').addEventListener('click',function(ev){var t=ev.target;while(t&&t!==this){var a=t.getAttribute('data-a');if(a){var s=t.getAttribute('data-s');var i=t.getAttribute('data-i');if(a==='ed')oMod(s,i);else if(a==='dl')dEnt(s,i);else if(a==='add')oMod(s,null);else if(a==='svs')svSet();else if(a==='clr'){if(confirm('Wirklich alle Daten löschen?')){db={settings:{},fahrzeuge:[],auftraege:[],inventar:[],kunden:[],lieferanten:[],finanzen:[],vertraege:[],versicherungen:[],zugaenge:[],kontakte:[],rechtliches:[],notizen:[]};lsSave();go('dashboard')}}return}t=t.parentNode}});
document.getElementById('main').addEventListener('input',function(ev){if(ev.target&&ev.target.id==='sb'){var cl=document.getElementById('cl');if(cl)cl.innerHTML=rCards(cPage,ev.target.value)}});
document.getElementById('ov').addEventListener('click',function(ev){if(ev.target===this)cMod()});
document.getElementById('bExp').addEventListener('click',expData);
document.getElementById('bFile').addEventListener('change',impData);
document.getElementById('bNew').addEventListener('click',function(){var s=cPage;if(s==='dashboard'||s==='einstellungen')s='notizen';oMod(s,null)});
document.getElementById('bSav').addEventListener('click',sEnt);
document.getElementById('bCan').addEventListener('click',cMod);

lsLoad();
go('dashboard');
</script>
</body>
</html>
